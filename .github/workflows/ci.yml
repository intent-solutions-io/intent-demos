name: CI

# First CI for this repo. Runs the catalog verifier (which includes the vendored
# estate bar check), the Mission Control and reachability unit tests, and a
# freshness check that the vendored bar still matches its canonical source.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: verify site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install --quiet 'pytest==9.1.1'
      - name: Unit tests
        run: python -m pytest -q scripts/test_mission_control.py scripts/test_regional_reachability.py scripts/test_public_navigation.py
      - name: Catalog and estate bar verifier
        # The deploy root does not exist on a runner; the verifier prints that the
        # deployed route targets were not checked instead of passing silently.
        run: python scripts/verify_site.py
      - name: Shell scripts parse
        run: bash -n scripts/deploy_local.sh scripts/sync_estate_bar.sh
